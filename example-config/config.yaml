# yaml-language-server: $schema=../schemas/config.schema.json
#
# An example opscout configuration. Every value in it is fake (Constitution Principle I).
# To start your own, copy this directory into your private configuration repository, as
# README.md explains. The reference is docs/reference/configuration.md.

# The major version of the configuration schema this file follows. This engine reads
# version 1; a file for another version gets one message that says what to do.
schema_version: 1

# Write-up formats for the summary skill (spec 003). Optional: without this section the
# built-in ticket, message and postmortem formats apply. `opscout writeup formats` prints
# the formats the skill will use.
writeups:
  # The language to write in; without it, the skill writes in the language you write in.
  language: English
  # Rules for every format, on top of the built-in ones (only facts; never what was ruled
  # out; never a secret value).
  rules:
    - Name services the way the team does, such as example-api or example-prod.
  # Formats by name. A built-in name (ticket, message, postmortem) replaces that format; a
  # new name, in lowercase words joined by hyphens, adds one.
  formats:
    # An extra format, asked for as "a status update".
    status-update:
      # What the format is for, in one line.
      description: "A weekly status line for #alerts-example."
      # The headings, in order.
      sections: [Done, Next, Blocked]
      # Rules for this format only.
      rules: [One line per item.]
      # The most lines a write-up in this format may have.
      max_lines: 8

# Conventions for the ship skill and the plugin's push guard (spec 004). Optional: without
# this section, main and master are protected, branches are named <type>/<slug>, and
# commits end with "Assisted-by: Claude Code". `opscout ship rules` prints them.
ship:
  # Branch patterns that are never pushed to. main, master and the remote's default branch
  # are protected whatever this list says.
  protected_branches: [main, "release/*"]
  # How new branches are named: {type}, {slug} and, optionally, {ticket}.
  branch_pattern: "{type}/{slug}"
  # The Conventional Commit types allowed in messages and branch names.
  types: [feat, fix, docs, chore, refactor, test, ci, build, perf]
  # The last line of every commit message the skill writes.
  trailer: "Assisted-by: Claude Code"
  # How pull requests are opened: always drafts.
  pull_request:
    # The target branch; without it, the remote's default branch.
    base: main

# The SSO check at the start of a Claude Code session (spec 005). Optional: without this
# section, every SSO session and older SSO profile in the AWS config is checked.
# `opscout sso check` prints each login's state.
sso:
  # Whether the check runs.
  enabled: true
  # The logins to check, by SSO session or profile name.
  sessions: [example-session, example-prod]

# The facts every Claude Code session should start with (spec 006). Optional.
# `opscout context diff` shows what `opscout context apply` would write into Claude Code's
# CLAUDE.md, between markers; nothing outside them changes.
personal_context:
  # The language Claude answers you in.
  language: English
  # Your time zone, as an IANA name.
  timezone: Europe/Lisbon
  # Headings, in order, each with the lines written under it.
  sections:
    # A heading, and the lines under it.
    Working rules:
      - Before any live fix in example-prod, list exactly what changes and wait.
    # Another heading.
    Environment:
      - example-prod is AWS account 123456789012, profile example-prod.

# Scheduled jobs (spec 007). Optional: without this section nothing is scheduled.
# `opscout daemon install` installs the enabled jobs after you confirm; `opscout run check`
# runs the check job by hand, once per day unless --force is given.
daemon:
  # The jobs to schedule, by name; the engine defines them.
  jobs:
    # The diagnostic job: one tool-less model run whose report lands in the outbox.
    check:
      # The time of day, in the machine's local time; quote it.
      at: "09:30"
      # The days it runs; without it, every day.
      weekdays: [mon, tue, wed, thu, fri]
  # Delivery by direct message (spec 008). Uncomment both parts, with your own member id
  # (Slack: your profile, then Copy member ID), after storing the two tokens with
  # opscout secret set slack_bot_token and opscout secret set slack_app_token.
  # chat:
  #   service: slack
  #   user: UEXAMPLE01
  # secrets:
  #   slack_bot_token:
  #     service: opscout-slack-bot
  #   slack_app_token:
  #     service: opscout-slack-app

# The daily standup (spec 009). Optional. `opscout standup preview` shows what it would
# send, and docs/reference/standup.md what is read and what never leaves.
standup:
  # Your commit author e-mails or names.
  identities: [dev@example.com]
  # Your projects: local clones and Bitbucket repositories.
  projects:
    # A project, by name.
    example-api:
      # Absolute paths of the local clones.
      paths: [/Users/example/src/example-api]
      # Bitbucket repositories, as workspace/slug.
      repositories: [example-workspace/example-api]
  # Terms never sent to the model.
  redact: [Example Corp]

