# The alert corpus's configuration (spec 011, T028): the two example formats of
# contracts/config.md and one fake environment.
schema_version: 1
alerts:
  formats:
    - name: example-notifier
      recognize: '^(CRITICAL|WARNING): '
      fields:
        severity: '^(CRITICAL|WARNING): '
        title: '^(?:CRITICAL|WARNING): (.+)$'
        project: '^Project: (.+)$'
        environment: '^Environment: (.+)$'
        resource: '^Resource: (.+)$'
        account: '^Account: (\d{12})'
        region: '^Region: ([a-z0-9-]+)$'
        metric: '^Metric: (.+)$'
        threshold: '^Threshold: (.+)$'
    - name: example-monitor
      recognize: '^Triggered: \['
      fields:
        project: '^Triggered: \[([^\]]+)\]'
        environment: '^Triggered: \[[^\]]+\]\[([^\]]+)\]'
        title: '^Triggered: (?:\[[^\]]+\]){2} ?(.+)$'
aws:
  environments:
    - name: example-prod
      account_id: "123456789012"
      profile: example-prod
      regions: [us-east-1]
      aliases: [Production, prod]
