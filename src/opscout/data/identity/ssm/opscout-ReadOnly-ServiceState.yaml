schemaVersion: "2.2"
description: "opscout: one systemd unit's state, without its command line (read-only)."
parameters:
  ServiceName:
    type: String
    description: "A systemd unit name."
    allowedPattern: "^[A-Za-z0-9@_][A-Za-z0-9@._-]{0,63}$"
    interpolationType: ENV_VAR
mainSteps:
  - action: aws:runShellScript
    name: serviceState
    precondition:
      StringEquals: [platformType, Linux]
    inputs:
      runCommand:
        - "systemctl show --property=ActiveState,SubState,MainPID,NRestarts,Result,ExecMainStartTimestamp -- \"$SSM_ServiceName\""
