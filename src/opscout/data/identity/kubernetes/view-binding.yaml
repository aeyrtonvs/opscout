# opscout's read-only identity sees what Kubernetes' built-in view role allows: no Secrets,
# no exec, attach or port-forward (spec 010, research R6).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: opscout-readonly-view
subjects:
  - kind: Group
    name: opscout:readonly
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
